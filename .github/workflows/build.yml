name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build APK with Capacitor
        run: |
          # 1. Copy web assets to www folder
          mkdir -p www
          cp -r index.html www/
          cp -r *.css *.js assets images style.css script.js www/ 2>/dev/null || true

          # 2. Setup configuration
          echo '{"name": "my-app", "version": "1.0.0"}' > package.json
          echo '{"appId": "com.myapp.htmlapk", "appName": "My HTML App", "webDir": "www"}' > capacitor.config.json

          # 3. Install Capacitor and add Android platform
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android

          # 4. Use lightweight Gradle binary and increase download timeout
          sed -i 's/-all.zip/-bin.zip/g' android/gradle/wrapper/gradle-wrapper.properties
          export JAVA_OPTS="-Dsun.net.client.defaultConnectTimeout=60000 -Dsun.net.client.defaultReadTimeout=60000"

          # 5. Build APK using Java 21
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.java.home=$JAVA_HOME

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
